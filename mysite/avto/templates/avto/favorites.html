{% extends 'avto/base.html' %}
{% block title %}Избранное{% endblock %}
{% block content %}
<h1>Избранное</h1>
{% for fav in favorites %}
  <div class="col-md-4 mb-3">
    <div class="card">
      <div class="card-body">
        <h5>{{ fav.car }}</h5>
        <p>{{ fav.car.price }} ₽</p>
        <a href="{{ fav.car.get_absolute_url }}" class="btn btn-sm btn-primary">Подробнее</a>
        <a href="{% url 'toggle_favorite' fav.car.id %}" class="btn btn-sm btn-outline-danger">Убрать</a>
      </div>
    </div>
  </div>
{% empty %}
  <p class="text-muted">В избранном пусто.</p>
{% endfor %}
</div>
{% endblock %}
