{% extends 'avto/base.html' %}
{% block title %}Регистрация — Kaido Spirit{% endblock %}
{% block content %}
<div class="ks-auth-wrap">
  <h1 class="ks-auth-title">Регистрация</h1>
  <div class="ks-form-card">
    <form method="post">{% csrf_token %}
      {% for field in form %}
        <div class="ks-form-group">
          <label class="ks-label">{{ field.label }}</label>
          {{ field }}
          {% for error in field.errors %}
            <div style="color:var(--crimson);font-size:0.8rem;margin-top:4px;">{{ error }}</div>
          {% endfor %}
        </div>
      {% endfor %}
      <button class="btn-ks btn-ks-lg" type="submit" style="width:100%;margin-top:8px;">Зарегистрироваться</button>
    </form>
  </div>
  <p style="text-align:center;margin-top:18px;font-style:italic;color:var(--text-muted);">
    Или <a href="{% url 'login' %}">войти</a>
  </p>
</div>
{% endblock %}
